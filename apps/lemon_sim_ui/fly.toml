app = "lemonsim"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_SERVER = "true"
  # Werewolf league arena (replaces LEMON_SIM_AUTO_LOOP for werewolf — do not
  # enable both, or the single-model auto-loop games will pollute the league).
  # WEREWOLF_ARENA_MODELS must be set (fly secrets or env) to a comma-separated
  # list of provider:model specs whose API keys are configured, e.g.
  # "anthropic:claude-sonnet-4-6,openai:gpt-5.2,google_gemini_cli:gemini-3-pro-preview".
  WEREWOLF_LEAGUE_DIR = "/app/data/werewolf_league"
  WEREWOLF_ARENA_PLAYER_COUNT = "6"
  LEMON_SIM_UI_PORT = "4090"
  RELEASE_NAME = "sim_broadcast_platform"

[http_service]
  internal_port = 4090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "lemonsim_data"
  destination = "/app/data"
