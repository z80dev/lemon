app = "lemonsim"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/lemon_sim_ui/Dockerfile"

[env]
  PHX_SERVER = "true"
  # Always-on model arenas (replace LEMON_SIM_AUTO_LOOP — do not enable both,
  # or single-model auto-loop games will pollute the leagues). Enable a domain
  # by setting LEMON_ARENA_<DOMAIN>_MODELS (fly secrets or env) to a
  # comma-separated list of provider:model specs whose API keys are
  # configured, e.g. LEMON_ARENA_WEREWOLF_MODELS =
  # "anthropic:claude-sonnet-4-6,openai:gpt-5.2,zai:glm-5".
  # Domains: WEREWOLF, SPACE_STATION, STOCK_MARKET, SURVIVOR, POKER.
  LEMON_ARENA_LEAGUE_ROOT = "/app/data/leagues"
  LEMON_STORE_PATH = "/app/data/store"
  LEMON_SIM_UI_HOST = "lemonsim.fly.dev"
  LEMON_SIM_UI_PORT = "4090"
  LEMON_SIM_UI_ADMIN_SESSION_TTL_SECONDS = "28800"
  LEMON_SIM_UI_MAX_CONCURRENT_RUNNERS = "8"
  LEMON_SIM_UI_MAX_STORED_SIMS = "500"
  # Hosted rooms are opt-in. Enabling requires the HTTPS external URL plus a
  # LEMON_WEREWOLF_HOST_CREATE_TOKEN secret of at least 32 bytes.
  LEMON_WEREWOLF_HOSTED_ENABLED = "false"
  LEMON_WEREWOLF_HOSTED_ROOM_LIMIT = "100"
  LEMON_WEREWOLF_HOSTED_ROOM_RETENTION = "500"
  LEMON_WEREWOLF_HOSTED_LOBBY_TTL_SECONDS = "86400"
  LEMON_WEREWOLF_HOSTED_INACTIVE_TTL_SECONDS = "604800"
  LEMON_WEREWOLF_HOSTED_AI_CONCURRENCY = "4"
  LEMON_ARENA_WEREWOLF_MAX_GAME_RECORDS = "1000"
  RELEASE_NAME = "sim_broadcast_platform"

[http_service]
  internal_port = 4090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "lemonsim_data"
  destination = "/app/data"
