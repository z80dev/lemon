name: OSV Scanner

# The single dependency-vulnerability surface for Mix, npm, and Bun lockfiles.
# Other workflows do not run `npm audit`; add new lockfiles here instead.

on:
  pull_request:
    branches: [main]
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/*/mix.exs"
      - "clients/*/package.json"
      - "clients/*/package-lock.json"
      - "clients/tui/bun.lock"
      - "apps/lemon_channels/priv/package.json"
      - "apps/lemon_channels/priv/package-lock.json"
      - "apps/lemon_sim_ui/assets/package.json"
      - "apps/lemon_sim_ui/assets/package-lock.json"
      - "docs/package.json"
      - "docs/package-lock.json"
      - "tools/diagrams/package.json"
      - "tools/diagrams/package-lock.json"
      - ".github/workflows/osv-scanner.yml"
  push:
    branches: [main]
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/*/mix.exs"
      - "clients/*/package.json"
      - "clients/*/package-lock.json"
      - "clients/tui/bun.lock"
      - "apps/lemon_channels/priv/package.json"
      - "apps/lemon_channels/priv/package-lock.json"
      - "apps/lemon_sim_ui/assets/package.json"
      - "apps/lemon_sim_ui/assets/package-lock.json"
      - "docs/package.json"
      - "docs/package-lock.json"
      - "tools/diagrams/package.json"
      - "tools/diagrams/package-lock.json"
      - ".github/workflows/osv-scanner.yml"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5
    with:
      scan-args: |-
        --lockfile=mix.lock
        --lockfile=clients/tui/bun.lock
        --lockfile=clients/lemon-browser-node/package-lock.json
        --lockfile=apps/lemon_channels/priv/package-lock.json
        --lockfile=apps/lemon_sim_ui/assets/package-lock.json
        --lockfile=docs/package-lock.json
        --lockfile=tools/diagrams/package-lock.json
      fail-on-vuln: false
