name: CI

# The gate for every pull request and every push to main, on GitHub-hosted
# runners. Each job runs a `scripts/test` lane or repository script, so local
# runs and CI execute the same commands.
#
#   changes      decides what a pull request can skip (every other event runs all)
#   check        scripts/test quality + scripts/test eval-fast (always)
#   test (1..4)  scripts/test fast split with ExUnit --partitions 4
#   dialyzer     full advisory run + allowlist gate (scripts/dialyzer_gate.sh)
#   sim-bench    offline sim suites and byte-determinism gates
#   install      scripts/verify_source_install + scripts/verify_install_script
#   clients      scripts/test clients (TUI + lemon-browser-node)
#   wasm-runtime cargo tests + WASM integration test
#   history      pull requests only: reject unrelated Git history
#   result       single required status; fails if any job failed or was cancelled,
#                summarizes failing jobs/tests, and on main pushes keeps the
#                `main-red` issue open while main is failing
#
# Every push to main runs every job, so a green run on a main commit means the
# commit was fully verified; release.yml relies on that (scripts/ci_verified_commit)
# and, when no such run exists, calls this workflow (workflow_call) as its
# preflight. nightly.yml calls it too. Pushes to main are serialized: one run in
# progress plus the newest pending one, so a burst of merges coalesces into the
# latest commit instead of queueing every intermediate commit.
#
# Caches: one deps/_build entry per MIX_ENV family and commit, saved only by
# pushes to main. Pull requests restore main's newest entry and compile
# incrementally instead of filling the repository's cache quota.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a release or
# nightly preflight never shares (or cancels) the group of main's push runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ExUnit fixture names and Lemon's Unicode path contracts need a UTF-8 locale.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # Pull requests: scripts/changed_tests maps the diff to affected umbrella apps
  # (touched apps plus their in_umbrella reverse dependencies) and lanes. It is
  # conservative: config, mix.exs/lock, scripts, workflows, release/installer
  # files or any unknown path select the full suite. Every other event (main
  # pushes, release preflight, nightly, manual dispatch) always runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.select.outputs.scope != 'none' }}
      scope: ${{ github.event_name != 'pull_request' && 'full' || steps.select.outputs.scope }}
      apps: ${{ steps.select.outputs.apps }}
      test_paths: ${{ github.event_name != 'pull_request' && '' || steps.select.outputs.test_paths }}
      partitions: ${{ github.event_name != 'pull_request' && '4' || steps.shards.outputs.partitions }}
      matrix: ${{ github.event_name != 'pull_request' && '[1,2,3,4]' || steps.shards.outputs.matrix }}
      clients: ${{ github.event_name != 'pull_request' || steps.select.outputs.clients == 'true' }}
      wasm: ${{ github.event_name != 'pull_request' || steps.select.outputs.wasm == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: Select affected apps and lanes
        if: github.event_name == 'pull_request'
        id: select
        run: scripts/changed_tests --base "origin/${GITHUB_BASE_REF}" --format github

      # Small selections run on one shard; the suite's long pole (coding_agent,
      # ~4-5 min of ExUnit across shards) and broad selections keep four.
      - name: Choose shard count
        if: github.event_name == 'pull_request'
        id: shards
        env:
          SCOPE: ${{ steps.select.outputs.scope }}
          APPS: ${{ steps.select.outputs.apps }}
        run: |
          read -r -a apps <<< "$APPS"
          if [ "$SCOPE" = full ] || [ "${#apps[@]}" -gt 6 ] || [[ " $APPS " == *" coding_agent "* ]]; then
            partitions=4
          else
            partitions=1
          fi
          echo "partitions=$partitions" >> "$GITHUB_OUTPUT"
          echo "matrix=$(seq -s, 1 "$partitions" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "shards: $partitions (scope $SCOPE, ${#apps[@]} apps)"

  # Cheapest, broadest signal first: format, credo, docs and architecture
  # checks also cover prose-only changes, so this job never skips. Pull
  # requests format/credo-check only their changed files (unless the diff is
  # full scope, e.g. formatter/Credo config); every other event checks all.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: Test CI checkout identity contract
        run: python3 scripts/test_ci_checkout_identity.py

      - name: BEAM setup
        id: beam
        uses: ./.github/actions/beam-setup
        with:
          family: test

      - name: scripts/test quality
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/test quality ${BASE:+--base "$BASE"}

      - name: scripts/test eval-fast
        run: scripts/test eval-fast

      - name: Save deps and _build
        if: github.event_name == 'push' && steps.beam.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ steps.beam.outputs.cache-key }}

  test:
    name: test (${{ matrix.partition }}/${{ needs.changes.outputs.partitions }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Shards finish in ~4 minutes; a hung VM should fail fast, not hold the run.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: BEAM setup
        uses: ./.github/actions/beam-setup
        with:
          family: test
          bun: "true"

      # TEST_PATHS is empty for a full run; otherwise the selected app test
      # directories (word-split on purpose).
      - name: scripts/test fast (partition ${{ matrix.partition }}/${{ needs.changes.outputs.partitions }})
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          PARTITIONS: ${{ needs.changes.outputs.partitions }}
          TEST_PATHS: ${{ needs.changes.outputs.test_paths }}
        run: |
          # shellcheck disable=SC2086
          scripts/test fast --partitions "$PARTITIONS" $TEST_PATHS

  dialyzer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: BEAM setup
        id: beam
        uses: ./.github/actions/beam-setup
        with:
          family: dev

      # PLTs live under _build/dialyzer (root mix.exs `dialyzer/0`); they only
      # change with the dependency/toolchain surface, so key them on mix.lock.
      - name: Restore Dialyzer PLTs
        id: plt
        uses: actions/cache/restore@v4
        with:
          path: _build/dialyzer
          key: ${{ runner.os }}-plt-otp28.5-elixir1.19.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp28.5-elixir1.19.5-

      - name: Compile
        run: mix compile

      - name: Build/refresh PLTs
        run: mix dialyzer --plt

      # The full umbrella keeps a documented backlog, so this run is advisory;
      # the gate below is what blocks. `--format github`/`short` crash on
      # OTP 28.5's `:exact_compare` tag, so use Erlang's own formatter.
      - name: Run Dialyzer (full, advisory)
        run: |
          set -o pipefail
          mix dialyzer --format dialyzer 2>&1 | tee dialyzer.out || true

      - name: Green gate — allowlisted packages must stay Dialyzer-clean
        run: scripts/dialyzer_gate.sh dialyzer.out

      - name: Save Dialyzer PLTs
        if: github.event_name == 'push' && steps.plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _build/dialyzer
          key: ${{ runner.os }}-plt-otp28.5-elixir1.19.5-${{ hashFiles('mix.lock') }}

      - name: Save deps and _build
        if: github.event_name == 'push' && steps.beam.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ steps.beam.outputs.cache-key }}

  # Only lemon_sim's suites; a change reaches them through lemon_sim itself or
  # one of its umbrella dependencies (both select lemon_sim).
  sim-bench:
    needs: changes
    if: needs.changes.outputs.scope == 'full' || contains(format(' {0} ', needs.changes.outputs.apps), ' lemon_sim ')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: BEAM setup
        uses: ./.github/actions/beam-setup
        with:
          family: dev

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run simulation bench lane
        run: scripts/ci_sim_bench.sh

      - name: Upload simulation bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sim-bench
          path: |
            ${{ runner.temp }}/sim-bench-ci/suites
            ${{ runner.temp }}/sim-bench-ci/scores
            ${{ runner.temp }}/sim-bench-ci/ratings/ratings.md
            ${{ runner.temp }}/sim-bench-ci/ratings/ratings.json

  # The supported source-checkout and installer flows. These used to run only
  # in the release preflight, where stale checks surfaced at release time.
  install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: BEAM setup
        id: beam
        uses: ./.github/actions/beam-setup
        with:
          family: install

      - name: Verify supported source and installer flows
        run: |
          scripts/verify_source_install
          scripts/verify_install_script

      - name: Save deps and _build
        if: github.event_name == 'push' && steps.beam.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ steps.beam.outputs.cache-key }}

  clients:
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/lemon-browser-node/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: clients/tui/.bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('clients/tui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: scripts/test clients
        run: scripts/test clients

  wasm-runtime:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: BEAM setup
        uses: ./.github/actions/beam-setup
        with:
          family: test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and native runtime target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/lemon-wasm-runtime/target
          key: ${{ runner.os }}-cargo-wasm-runtime-${{ hashFiles('native/lemon-wasm-runtime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-runtime-

      - name: Install WASM target
        run: rustup target add wasm32-wasip2

      - name: Run WASM runtime tests
        run: cargo test --manifest-path native/lemon-wasm-runtime/Cargo.toml

      # The coding_agent test_helper isolates HOME, so pin the rustup/cargo
      # toolchain homes installed by dtolnay/rust-toolchain explicitly.
      - name: Run WASM integration tests
        run: |
          RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" \
            scripts/test path apps/coding_agent/test/coding_agent/wasm_integration_test.exs --include integration

  history:
    if: github.event_name == 'pull_request'
    name: Reject unrelated history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: Fetch base branch
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Require a common ancestor with base
        run: |
          if ! BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD 2>/dev/null) || [ -z "$BASE" ]; then
            echo "::error::This PR has no common ancestor with ${GITHUB_BASE_REF}."
            echo "Merging it would graft an unrelated root into Lemon's main history."
            echo "Recreate the branch from the current target branch, then"
            echo "cherry-pick or re-apply the intended changes."
            exit 1
          fi

          echo "::notice::Common ancestor with ${GITHUB_BASE_REF}: $BASE"

  # One status to require. Skipped jobs (unchanged paths) are fine; failed or
  # cancelled ones are not. Failing jobs and ExUnit failures are summarized on
  # the run page; on main pushes the `main-red` issue opens on the first red
  # run and closes on the next green one, so breakage surfaces right after the
  # merge that caused it rather than at release time.
  result:
    name: CI result
    if: always()
    needs: [changes, check, test, dialyzer, sim-bench, install, clients, wasm-runtime, history]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      # The required summary check must attest even when optional lanes skip.
      - uses: actions/checkout@v4

      - name: Record tested checkout identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("FACTORY_CI_IDENTITY=" + json.dumps({
              "tested_sha": tested,
              "pr_head_sha": os.environ["PR_HEAD_SHA"] or tested,
              "base_sha": os.environ["PR_BASE_SHA"] or tested,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }))
          PY

      - name: Classify job results
        id: status
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          status=success
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) status=failure ;;
            esac
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize failures
        if: steps.status.outputs.status == 'failure' && contains(needs.*.result, 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_failure_report summary --run-id "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Track main health (main-red issue)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci_failure_report track --run-id "$GITHUB_RUN_ID" \
            --label main-red --title "main CI is failing" \
            --status "${{ steps.status.outputs.status }}"

      - name: Require every job to pass or skip
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a CI job finished with: $result"; exit 1 ;;
            esac
          done
