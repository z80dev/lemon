name: Nightly

# Slow or repetitive lanes that should not gate every pull request, plus a
# full CI run of main's head:
#   - ci: every ci.yml job (workflow_call), catching time-, date- or
#     environment-dependent breakage on days without merges
#   - coverage: scripts/test coverage (ExUnit excluding integration with
#     --cover, enforcing each app's test_coverage threshold)
#   - determinism: repeats prompt/skill/overflow regression files to catch
#     non-deterministic output, then runs the eval harness for 20 iterations
#   - latency: offline latency distribution/regression check, then the lane's
#     `:slow` ExUnit test
#   - integration: credential-free `:integration` cases (provider error handling)
#   - report: keeps the `nightly-red` issue open while a nightly job fails

on:
  schedule:
    # 04:17 UTC daily (off-peak, intentionally not on the hour)
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      issues: write

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: BEAM setup
        uses: ./.github/actions/beam-setup
        with:
          family: test
          bun: "true"

      - name: Select every app
        id: select
        run: scripts/changed_tests --all --format github

      # TEST_PATHS is word-split on purpose.
      - name: scripts/test coverage
        env:
          TEST_PATHS: ${{ steps.select.outputs.test_paths }}
        run: |
          # shellcheck disable=SC2086
          scripts/test coverage $TEST_PATHS

  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: BEAM setup
        uses: ./.github/actions/beam-setup
        with:
          family: test

      - name: Deterministic regression loop
        run: |
          scripts/test path \
            apps/coding_agent/test/coding_agent/session_overflow_recovery_test.exs \
            apps/lemon_skills/test/lemon_skills/discovery_test.exs \
            apps/lemon_skills/test/mix/tasks/lemon.skill_test.exs \
            apps/lemon_skills/test/lemon_skills/prompt_regression_test.exs \
            --repeat-until-failure 5

      - name: Eval harness (20 iterations)
        run: scripts/test eval-fast
        env:
          LEMON_EVAL_ITERATIONS: "20"

  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/beam-setup
        with:
          family: dev
      - name: Compile development runtime
        run: MIX_ENV=dev mix compile --warnings-as-errors
      - name: Find previous successful nightly baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p latency-baseline
          run_id="$(gh run list --workflow nightly.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "latency-results" and .expired == false) | .id')"
            if [ -n "$artifact_id" ]; then
              gh run download "$run_id" --name latency-results --dir latency-baseline
            fi
          fi
      - name: Offline latency distribution and regression check
        run: |
          baseline=()
          if [ -f latency-baseline/latency.json ]; then
            baseline=(--baseline latency-baseline/latency.json)
          else
            echo "::notice::Latency bootstrap: no retained successful baseline"
          fi
          mix lemon.eval.latency --boots 5 --turns 20 \
            --revision "$GITHUB_SHA" --output latency-results/latency.json "${baseline[@]}"
      - name: Retain sanitized latency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-results
          path: latency-results/latency.json
          if-no-files-found: warn
          retention-days: 90
      # The lane's own end-to-end test (`:slow`, excluded from the fast lane):
      # one credential-free boot under the test build.
      - name: Offline latency lane test
        run: scripts/test path apps/lemon_evals/test/lemon_evals/latency_test.exs --include slow

  # Credential-free `:integration` cases. scripts/test scrubs provider
  # credentials, so this proves the selection needs none: invalid-key handling
  # against the real provider endpoints. Credentialed live suites fail rather
  # than pass without keys and stay manual (docs/testing.md).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: BEAM setup
        uses: ./.github/actions/beam-setup
        with:
          family: test

      - name: Credential-free provider integration
        run: |
          scripts/test path \
            apps/lemon_ai/test/integration_test.exs \
            apps/lemon_ai/test/provider_integration_test.exs \
            --only provider:error_handling

  report:
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [ci, coverage, determinism, latency, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout report script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci_failure_report
          sparse-checkout-cone-mode: false

      - name: Track nightly health (nightly-red issue)
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: |
          if [ "$STATUS" = failure ]; then
            scripts/ci_failure_report summary --run-id "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          fi
          scripts/ci_failure_report track --run-id "$GITHUB_RUN_ID" \
            --label nightly-red --title "Nightly is failing" --status "$STATUS"
