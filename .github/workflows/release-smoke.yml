name: Release Smoke Tests

# Assembles runtime releases, verifies they start and pass doctor checks,
# then tears down. Runs on PRs touching release-related files and weekly.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/lemon_core/lib/lemon_core/runtime/**"
      - "apps/lemon_core/lib/mix/tasks/lemon.doctor.ex"
      - "apps/lemon_sim/lib/lemon_sim/examples/werewolf/**"
      - "apps/lemon_sim_ui/**"
      - "config/prod.exs"
      - "config/runtime.exs"
      - ".dockerignore"
      - ".github/workflows/release-smoke.yml"
      - ".github/workflows/release.yml"
      - "scripts/verify_release_artifacts"
      - "scripts/verify_release_runtime_boot"
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: "Core release profile to smoke-test; Sim UI is covered by the container job"
        type: choice
        required: true
        default: "lemon_runtime_min"
        options:
          - lemon_runtime_min
          - lemon_runtime_full

env:
  MIX_ENV: prod
  LEMON_SECRETS_MASTER_KEY: "smoke-test-dummy-key-32-chars-!!"
  LEMON_CONTROL_PLANE_PORT: "14040"
  LEMON_WEB_PORT: "14080"
  LEMON_WEB_SECRET_KEY_BASE: "runtime_smoke_web_secret_key_base_runtime_smoke_web_secret_key_base_runtime"
  LEMON_SIM_UI_PORT: "14090"
  LEMON_GATEWAY_NODE_COOKIE: "release-smoke-cookie"

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEMON_STORE_PATH: /tmp/lemon-store

    strategy:
      fail-fast: false
      matrix:
        profile:
          - ${{ github.event.inputs.profile || 'lemon_runtime_min' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-release-${{ hashFiles('mix.lock') }}-${{ matrix.profile }}
          restore-keys: |
            ${{ runner.os }}-mix-release-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-mix-release-

      - name: Install deps
        run: mix deps.get --only prod

      - name: Compile (prod)
        run: mix compile

      - name: Build release
        run: mix release ${{ matrix.profile }} --overwrite
        env:
          MIX_ENV: prod

      - name: Write fixture config
        run: |
          mkdir -p ~/.lemon
          cat > ~/.lemon/config.toml <<'EOF'
          [defaults]
          provider = "anthropic"
          model = "claude-sonnet-4-20250514"

          [gateway]
          max_concurrent_runs = 1
          auto_resume = false
          enable_telegram = false
          EOF

      - name: Start release in background
        run: |
          RELEASE_BIN="./_build/prod/rel/${{ matrix.profile }}/bin/${{ matrix.profile }}"
          "$RELEASE_BIN" daemon
          echo "RELEASE_BIN=$RELEASE_BIN" >> "$GITHUB_ENV"
          echo "Release started. Waiting for control-plane..."
          sleep 5

      - name: Wait for control-plane healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sS --max-time 2 "http://127.0.0.1:${LEMON_CONTROL_PLANE_PORT}/healthz" > /dev/null 2>&1; then
              echo "Control-plane healthy after $i attempts."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Control-plane did not become healthy within 30 seconds."
          exit 1

      - name: Run doctor check via HTTP
        run: |
          RESPONSE=$(curl -sS --max-time 5 "http://127.0.0.1:${LEMON_CONTROL_PLANE_PORT}/healthz")
          echo "healthz response: $RESPONSE"

      - name: Verify Web health
        if: matrix.profile == 'lemon_runtime_full'
        run: curl --fail --silent --show-error "http://127.0.0.1:${LEMON_WEB_PORT}/healthz" | grep -Fx ok

      - name: Install test deps
        run: mix deps.get
        env:
          MIX_ENV: test

      - name: Run release smoke tests
        run: |
          MIX_ENV=test mix test --no-start \
            apps/lemon_core/test/lemon_core/release/ \
            --include smoke \
            --formatter ExUnit.CLIFormatter
        env:
          MIX_ENV: test
          LEMON_RUNTIME_SMOKE_PORT: ${{ env.LEMON_CONTROL_PLANE_PORT }}

      - name: Stop release
        if: always()
        run: |
          if [ -n "$RELEASE_BIN" ] && [ -f "$RELEASE_BIN" ]; then
            "$RELEASE_BIN" stop || true
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          LOG_DIR="./_build/prod/rel/${{ matrix.profile }}/tmp/log"
          if [ -d "$LOG_DIR" ]; then
            echo "=== Release logs ==="
            cat "$LOG_DIR"/*.log 2>/dev/null || echo "(no log files found)"
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            _build/prod/rel/${{ matrix.profile }}/tmp/log/
            ~/.lemon/config.toml
          retention-days: 7

  sim-container-smoke:
    name: Sim broadcast container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lemon_sim_ui/assets/package-lock.json

      - name: Build production image
        run: |
          docker build \
            --build-arg "LEMON_GIT_SHA=$GITHUB_SHA" \
            --file apps/lemon_sim_ui/Dockerfile \
            --tag lemon-sim-broadcast:smoke \
            .

      - name: Start container
        run: |
          mkdir -p /tmp/lemon-sim-smoke-data
          docker run --detach \
            --name lemon-sim-smoke \
            --publish 14090:4090 \
            --env LEMON_SIM_UI_HOST=localhost \
            --env LEMON_SIM_UI_PORT=4090 \
            --env LEMON_SIM_UI_URL_SCHEME=http \
            --env LEMON_SIM_UI_URL_PORT=14090 \
            --env LEMON_SIM_UI_SECRET_KEY_BASE=runtime_smoke_secret_key_base_runtime_smoke_secret_key_base_runtime_smoke \
            --env LEMON_SIM_UI_ACCESS_TOKEN=runtime-smoke-access-token-32-bytes-minimum \
            --volume /tmp/lemon-sim-smoke-data:/app/data \
            lemon-sim-broadcast:smoke

      - name: Verify health, identity, auth, and assets
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:14090/readyz > /tmp/ready.json; then
              break
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:14090/healthz | grep -Fx ok
          grep -F "\"commit\":\"$GITHUB_SHA\"" /tmp/ready.json
          test "$(docker exec lemon-sim-smoke awk '/^Uid:/{print $2}' /proc/1/status)" = "10001"

          curl --fail --silent --show-error http://127.0.0.1:14090/ > /tmp/lobby.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:14090/admin)" = "401"

          asset_path=$(grep -oE '/assets/app-[a-f0-9]+\.css' /tmp/lobby.html | head -1)
          test -n "$asset_path"
          curl --silent --show-error --head \
            --header 'Accept-Encoding: gzip' \
            "http://127.0.0.1:14090$asset_path" > /tmp/asset-headers.txt
          grep -i '^content-encoding: gzip' /tmp/asset-headers.txt
          grep -i '^cache-control: public,max-age=31536000,immutable' /tmp/asset-headers.txt

      - name: Seed persisted Werewolf fixture
        run: |
          docker exec lemon-sim-smoke \
            /app/bin/sim_broadcast_platform rpc \
            'state = LemonSim.Examples.Werewolf.initial_state(sim_id: "ci_werewolf", player_count: 5, seed: 7); state = LemonSim.Kernel.State.put_world(state, %{phase: "game_over", status: "game_over", winner: "villagers"}); LemonSim.Kernel.Store.put_state(state)'
          curl --fail --silent --show-error http://127.0.0.1:14090/watch/ci_werewolf | grep -F 'VILLAGERS WIN'

      - name: Verify responsive LiveView browser updates
        run: |
          npm ci --prefix apps/lemon_sim_ui/assets --cache /tmp/lemon-sim-ui-npm-cache

          docker exec lemon-sim-smoke \
            /app/bin/sim_broadcast_platform rpc \
            'state = LemonSim.Examples.Werewolf.initial_state(sim_id: "ci_werewolf_browser", player_count: 5, seed: 11); state = LemonSim.Kernel.State.put_world(state, %{phase: "night", status: "in_progress", active_actor_id: "player_1"}); LemonSim.Kernel.Store.put_state(state)'

          ready_file=/tmp/werewolf-browser-ready
          rm -f "$ready_file"
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" \
          WEREWOLF_SMOKE_URL=http://localhost:14090/watch/ci_werewolf_browser \
          WEREWOLF_SMOKE_READY_FILE="$ready_file" \
          WEREWOLF_SMOKE_INITIAL_PHASE=Nightfall \
          WEREWOLF_SMOKE_UPDATED_PHASE='Town Square' \
            npm --prefix apps/lemon_sim_ui/assets run smoke:werewolf &
          browser_pid=$!

          for attempt in $(seq 1 30); do
            test -f "$ready_file" && break
            sleep 1
          done
          test -f "$ready_file"

          docker exec lemon-sim-smoke \
            /app/bin/sim_broadcast_platform rpc \
            'state = LemonSim.Kernel.Store.get_state("ci_werewolf_browser"); world = state.world |> Map.put(:phase, "day_discussion") |> Map.put(:active_actor_id, "player_2"); state = %{state | world: world, version: state.version + 1}; :ok = LemonSim.Kernel.Store.put_state(state); LemonSim.Kernel.Bus.broadcast_world_update("ci_werewolf_browser", %{state: state})'

          wait "$browser_pid"

      - name: Verify graceful restart and persistence
        run: |
          docker stop --timeout 30 lemon-sim-smoke
          docker run --rm \
            --entrypoint chown \
            --volume /tmp/lemon-sim-smoke-data:/app/data \
            lemon-sim-broadcast:smoke \
            --recursive 0:0 /app/data
          docker start lemon-sim-smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:14090/readyz > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:14090/watch/ci_werewolf | grep -F 'VILLAGERS WIN'

      - name: Verify production hosted mode and room recovery
        run: |
          mkdir -p /tmp/lemon-hosted-smoke-data
          docker run --detach \
            --name lemon-sim-hosted-smoke \
            --publish 14092:4090 \
            --env LEMON_SIM_UI_HOST=hosted.example.test \
            --env LEMON_SIM_UI_PORT=4090 \
            --env LEMON_SIM_UI_URL_SCHEME=https \
            --env LEMON_SIM_UI_URL_PORT=443 \
            --env LEMON_SIM_UI_SECRET_KEY_BASE=hosted_runtime_smoke_secret_key_base_hosted_runtime_smoke_secret_key_base \
            --env LEMON_SIM_UI_ACCESS_TOKEN=hosted-runtime-smoke-access-token-minimum \
            --env LEMON_WEREWOLF_HOSTED_ENABLED=true \
            --env LEMON_WEREWOLF_HOST_CREATE_TOKEN=hosted-runtime-smoke-create-token-minimum \
            --volume /tmp/lemon-hosted-smoke-data:/app/data \
            lemon-sim-broadcast:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:14092/readyz > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --silent --show-error --dump-header /tmp/hosted-headers.txt \
            --output /dev/null http://127.0.0.1:14092/play
          grep -i '^cache-control: private, no-store' /tmp/hosted-headers.txt
          grep -i '^set-cookie: .*; secure;' /tmp/hosted-headers.txt

          docker exec lemon-sim-hosted-smoke \
            /app/bin/sim_broadcast_platform rpc \
            'alias LemonSimUi.HostedGame; {:ok, created} = HostedGame.create_room(%{player_count: 5, ai_seats: 0, visibility: "private", rules_preset: "classic", turn_timeout_seconds: 30}); {:ok, host} = HostedGame.host_view(created.room_id, created.host_token); Enum.each(host.seats, fn seat -> {:ok, _claim} = HostedGame.claim_seat(created.join_code, seat.id, "CI " <> seat.id) end); :ok = HostedGame.control(created.room_id, created.host_token, "start"); :ok = HostedGame.control(created.room_id, created.host_token, "pause")'

          docker restart lemon-sim-hosted-smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:14092/readyz > /dev/null; then
              break
            fi
            sleep 2
          done

          docker exec lemon-sim-hosted-smoke \
            /app/bin/sim_broadcast_platform rpc \
            'alias LemonCore.Store; alias LemonSimUi.HostedGame; alias LemonSimUi.HostedGame.Room; rooms = Store.list(HostedGame.room_table()); true = Enum.any?(rooms, fn {_id, value} -> room = Room.normalize(value); match?(%Room{status: "paused", match_number: 1, command_seq: 0}, room) and is_integer(room.paused_remaining_ms) end)'

      - name: Collect container logs
        if: failure()
        run: |
          docker logs lemon-sim-smoke || true
          docker logs lemon-sim-hosted-smoke || true

      - name: Stop container
        if: always()
        run: |
          docker rm --force lemon-sim-smoke >/dev/null 2>&1 || true
          docker rm --force lemon-sim-hosted-smoke >/dev/null 2>&1 || true

  hosted-werewolf-browser-smoke:
    name: Hosted Werewolf multiplayer browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/lemon_sim_ui/assets/package-lock.json

      - name: Install and build
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          npm ci --prefix apps/lemon_sim_ui/assets --cache /tmp/lemon-sim-ui-npm-cache
          npm --prefix apps/lemon_sim_ui/assets run build

      - name: Start hosted test server
        env:
          MIX_ENV: dev
          LEMON_STORE_PATH: /tmp/lemon-hosted-browser-store
          LEMON_SIM_UI_PORT: "14091"
        run: |
          mix phx.server > /tmp/lemon-hosted-browser.log 2>&1 &
          echo "HOSTED_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:14091/readyz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lemon-hosted-browser.log
          exit 1

      - name: Run five-session hosted smoke
        env:
          HOSTED_WEREWOLF_SMOKE_URL: http://127.0.0.1:14091
        run: npm --prefix apps/lemon_sim_ui/assets run smoke:hosted-werewolf

      - name: Collect hosted server logs
        if: failure()
        run: cat /tmp/lemon-hosted-browser.log || true

      - name: Stop hosted test server
        if: always()
        run: kill "$HOSTED_SERVER_PID" 2>/dev/null || true
