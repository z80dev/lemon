name: Release Smoke Tests

# Assembles both runtime releases, verifies their packaged library contracts,
# then verifies they start and pass doctor checks before teardown. Runs on PRs
# touching release-related files and weekly.

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/lemon_core/lib/lemon_core/runtime/**"
      - "apps/lemon_core/lib/mix/tasks/lemon.doctor.ex"
      - "apps/lemon_mcp/**"
      - "apps/lemon_skills/lib/lemon_skills/mcp_source.ex"
      - "config/prod.exs"
      - "config/runtime.exs"
      - ".dockerignore"
      - ".github/workflows/release-smoke.yml"
      - ".github/workflows/release.yml"
      - "rel/overlays/bin/lemon"
      - "clients/tui/**"
      - "clients/lemon-browser-node/**"
      - "apps/lemon_browser/priv/**"
      - "scripts/verify_release_artifacts"
      - "scripts/verify_release_runtime_boot"
      - "install.sh"
      - "scripts/verify_install_script"
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Release profile to smoke-test
        type: choice
        required: true
        default: lemon_runtime_min
        options:
          - lemon_runtime_min
          - lemon_runtime_full

env:
  MIX_ENV: prod
  LEMON_SECRETS_MASTER_KEY: "smoke-test-dummy-key-32-chars-!!"
  LEMON_CONTROL_PLANE_PORT: "14040"
  LEMON_WEB_PORT: "14080"
  LEMON_WEB_SECRET_KEY_BASE: "runtime_smoke_web_secret_key_base_runtime_smoke_web_secret_key_base_runtime"
  LEMON_SIM_UI_PORT: "14090"
  LEMON_GATEWAY_NODE_COOKIE: "release-smoke-cookie"
  # Phoenix endpoints are opt-in in releases so eval/rpc commands do not bind
  # sockets. The full-runtime smoke explicitly exercises those endpoints.
  PHX_SERVER: "1"

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEMON_STORE_PATH: /tmp/lemon-store

    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.profile) || '["lemon_runtime_min","lemon_runtime_full"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"
          # setup-beam never retries a mirror; jsDelivr proxies builds.hex.pm.
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      # Runtime releases build and bundle clients/lemon-browser-node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/lemon_sim_ui/assets/package-lock.json
            clients/lemon-browser-node/package-lock.json

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-release-${{ hashFiles('mix.lock') }}-${{ matrix.profile }}
          restore-keys: |
            ${{ runner.os }}-mix-release-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-mix-release-

      - name: Install deps
        run: mix deps.get --only prod

      - name: Build Sim UI assets
        if: matrix.profile != 'lemon_runtime_min'
        run: mix sim_ui.assets.deploy

      - name: Digest lemon_web assets
        if: matrix.profile == 'lemon_runtime_full'
        run: |
          mix 'do' --app lemon_web phx.digest
          test -f apps/lemon_web/priv/static/cache_manifest.json

      - name: Assert Sim UI digest manifest
        if: matrix.profile != 'lemon_runtime_min'
        run: test -f apps/lemon_sim_ui/priv/static/cache_manifest.json

      - name: Compile (prod)
        run: mix compile

      - name: Build release
        run: mix release ${{ matrix.profile }} --overwrite
        env:
          MIX_ENV: prod

      - name: Verify packaged MCP library contract
        run: |
          RELEASE_BIN="./_build/prod/rel/${{ matrix.profile }}/bin/${{ matrix.profile }}"

          env -u LEMON_MCP_DISABLED "$RELEASE_BIN" eval '
            client_loaded = Code.ensure_loaded?(LemonMCP.Client)
            source_loaded = Code.ensure_loaded?(LemonSkills.McpSource)

            checks = %{
              client_loaded: client_loaded,
              source_loaded: source_loaded,
              source_enabled: source_loaded and LemonSkills.McpSource.mcp_enabled?(),
              application_loaded:
                Enum.any?(Application.loaded_applications(), fn {app, _, _} ->
                  app == :lemon_mcp
                end),
              application_not_started:
                not Enum.any?(Application.started_applications(), fn {app, _, _} ->
                  app == :lemon_mcp
                end),
              no_application_callback: Application.spec(:lemon_mcp, :mod) == [],
              no_application_module: not Code.ensure_loaded?(LemonMCP.Application)
            }

            failures = for {name, false} <- checks, do: name

            if failures != [] do
              raise "packaged MCP library contract failed: #{inspect(failures)}"
            end

            IO.puts("packaged MCP library contract passed: #{inspect(checks)}")
          '

      - name: Write fixture config
        run: |
          mkdir -p ~/.lemon
          cat > ~/.lemon/config.toml <<'EOF'
          [defaults]
          provider = "anthropic"
          model = "claude-sonnet-4-20250514"

          [gateway]
          max_concurrent_runs = 1
          auto_resume = false
          enable_telegram = false
          EOF

      - name: Start release in background
        run: |
          RELEASE_BIN="./_build/prod/rel/${{ matrix.profile }}/bin/${{ matrix.profile }}"
          "$RELEASE_BIN" daemon
          echo "RELEASE_BIN=$RELEASE_BIN" >> "$GITHUB_ENV"
          echo "Release started. Waiting for control-plane..."
          sleep 5

      - name: Wait for control-plane healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sS --max-time 2 "http://127.0.0.1:${LEMON_CONTROL_PLANE_PORT}/healthz" > /dev/null 2>&1; then
              echo "Control-plane healthy after $i attempts."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Control-plane did not become healthy within 30 seconds."
          exit 1

      - name: Run doctor check via HTTP
        run: |
          RESPONSE=$(curl -sS --max-time 5 "http://127.0.0.1:${LEMON_CONTROL_PLANE_PORT}/healthz")
          echo "healthz response: $RESPONSE"

      - name: Verify Web health
        if: matrix.profile == 'lemon_runtime_full'
        run: curl --fail --silent --show-error "http://127.0.0.1:${LEMON_WEB_PORT}/healthz" | grep -Fx ok

      - name: Install test deps
        run: mix deps.get
        env:
          MIX_ENV: test

      - name: Run release smoke tests
        run: |
          MIX_ENV=test mix test --no-start \
            apps/lemon_core/test/lemon_core/release/ \
            --include smoke \
            --formatter ExUnit.CLIFormatter
        env:
          MIX_ENV: test
          LEMON_RUNTIME_SMOKE_PORT: ${{ env.LEMON_CONTROL_PLANE_PORT }}

      - name: Stop release
        if: always()
        run: |
          if [ -n "$RELEASE_BIN" ] && [ -f "$RELEASE_BIN" ]; then
            "$RELEASE_BIN" stop || true
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          LOG_DIR="./_build/prod/rel/${{ matrix.profile }}/tmp/log"
          if [ -d "$LOG_DIR" ]; then
            echo "=== Release logs ==="
            cat "$LOG_DIR"/*.log 2>/dev/null || echo "(no log files found)"
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            _build/prod/rel/${{ matrix.profile }}/tmp/log/
            ~/.lemon/config.toml
          retention-days: 7

  overlay-shim-smoke:
    name: Overlay shim smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Isolate this job from the workflow-level env: it exercises the shim's
    # own cookie/secret-key-base generation, which only fires when unset.
    env:
      LEMON_WEB_SECRET_KEY_BASE: ""

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck overlay shim
        if: runner.os == 'Linux'
        run: shellcheck rel/overlays/bin/lemon

      # erlef/setup-beam publishes precompiled OTP/Elixir for macOS runners
      # too (see .github/workflows/release.yml for the fallback note if this
      # ever stops being true).
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"
          # setup-beam never retries a mirror; jsDelivr proxies builds.hex.pm.
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/lemon-browser-node/package-lock.json

      - name: Cache Mix deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ matrix.os }}-mix-release-${{ hashFiles('mix.lock') }}-lemon_runtime_min
          restore-keys: |
            ${{ matrix.os }}-mix-release-${{ hashFiles('mix.lock') }}-
            ${{ matrix.os }}-mix-release-

      - name: Install deps
        run: mix deps.get --only prod

      - name: Compile (prod)
        run: mix compile

      - name: Build release
        run: mix release lemon_runtime_min --overwrite

      - name: Smoke the overlay shim
        env:
          HOME: ${{ runner.temp }}/lemon-shim-home
        run: |
          mkdir -p "$HOME"

          RELEASE_DIR="_build/prod/rel/lemon_runtime_min"
          SHIM="$RELEASE_DIR/bin/lemon"
          test -x "$SHIM"

          "$SHIM" --help > /dev/null

          version_output="$("$SHIM" version)"
          echo "reported version: $version_output"
          [ -n "$version_output" ]

          "$SHIM" daemon

          status_ok=0
          for _attempt in $(seq 1 20); do
            if "$SHIM" status; then
              status_ok=1
              break
            fi
            sleep 1
          done
          [ "$status_ok" -eq 1 ]

          test -f "$HOME/.lemon/cookie"
          test -f "$HOME/.lemon/env"
          test -f "$HOME/.lemon/run/lemon-${LEMON_CONTROL_PLANE_PORT}.pid"
          test -f "$HOME/.lemon/run/lemon-${LEMON_CONTROL_PLANE_PORT}.root"
          grep -q LEMON_WEB_SECRET_KEY_BASE "$HOME/.lemon/env"

          # macOS `stat` has no GNU -c; fall back to BSD -f.
          cookie_perms="$(stat -c '%a' "$HOME/.lemon/cookie" 2>/dev/null || stat -f '%Lp' "$HOME/.lemon/cookie")"
          env_perms="$(stat -c '%a' "$HOME/.lemon/env" 2>/dev/null || stat -f '%Lp' "$HOME/.lemon/env")"
          [ "$cookie_perms" = "600" ]
          [ "$env_perms" = "600" ]

          "$SHIM" stop

          test ! -f "$HOME/.lemon/run/lemon-${LEMON_CONTROL_PLANE_PORT}.pid"

          echo "overlay shim smoke passed"

      - name: Collect logs on failure
        if: failure()
        env:
          HOME: ${{ runner.temp }}/lemon-shim-home
        run: |
          LOG_DIR="_build/prod/rel/lemon_runtime_min/tmp/log"
          if [ -d "$LOG_DIR" ]; then
            echo "=== Release logs ==="
            cat "$LOG_DIR"/*.log 2>/dev/null || echo "(no *.log files found)"
          fi
          echo "=== ~/.lemon/run ==="
          ls -la "$HOME/.lemon/run" 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-shim-smoke-logs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            _build/prod/rel/lemon_runtime_min/tmp/log/
          retention-days: 7
          if-no-files-found: ignore

  tui-smoke:
    name: TUI binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: clients/tui/.bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('clients/tui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install client dependencies
        working-directory: clients/tui
        run: bun install --frozen-lockfile

      # Host target only: the release workflow owns the three-platform
      # cross-build. This job guards the compile path itself — the binary must
      # be produced, load its native addon (pi-tui pulls it in during module
      # init), and answer `--version` with no TTY.
      - name: Build host binary
        working-directory: clients/tui
        run: bun scripts/build-binary.ts

      - name: Run the compiled binary
        working-directory: clients/tui
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin) PLATFORM=darwin-arm64 ;;
            *) PLATFORM=linux-x86_64 ;;
          esac
          BIN="dist/$PLATFORM/tui/bin/lemon-tui"
          test -x "$BIN"
          ls "dist/$PLATFORM/tui/bin/"pi_natives.*.node >/dev/null
          REPORTED=$("$BIN" --version)
          echo "lemon-tui --version -> $REPORTED"
          test -n "$REPORTED"

  # macOS only: ci.yml's install job already runs scripts/verify_install_script
  # on Linux for every PR touching the installer (full scope), every main push,
  # and nightly.
  install-script:
    name: Install script (macos-15)
    runs-on: macos-15
    timeout-minutes: 15

    # The installer must be exercised with the environment a real user has,
    # not this workflow's MIX_ENV/LEMON_* smoke settings; the verifier runs
    # install.sh under `env -i` and this override keeps the job honest.
    env:
      MIX_ENV: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image ships python3; setup-python makes the installer's
      # manifest-parsing prerequisite explicit, matching docs/install.md.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify install.sh against a fixture release
        run: scripts/verify_install_script
