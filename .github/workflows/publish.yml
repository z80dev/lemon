name: Publish package

# Publishes ONE of the five Hex packages (scripts/verify_packages --list) from a
# per-package tag.
#
# Triggers:
#   - push a tag matching `<package>-v<version>` (e.g. lemon_ai-v0.2.0)
#   - manually dispatch with a package + version, optionally verify-only
#
# Steps:
#   1. Parse the tag into package + version.
#   2. `scripts/release_package --verify`: mix.exs is at the tagged version, the
#      package CHANGELOG has that version's section, every sibling Lemon
#      package it depends on is already on hex.pm, and scripts/verify_packages
#      passes against the unpacked tarballs.
#   3. `scripts/release_package --publish-tagged`: publish package + docs from
#      the unpacked tarball — skipped when HEX_API_KEY is absent.
#
# The umbrella's own CalVer binary release is release.yml; its `v*.*.*` tag
# pattern and this one cannot collide.
#
# See docs/release/hex-packages.md for the release procedure.

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (lemon_ai, lemon_core, lemon_agent, lemon_memory, lemon_platform_test)"
        required: true
      version:
        description: "Version to publish (e.g. 0.2.0). Must match mix.exs."
        required: true
      verify_only:
        description: "Run the checks but do not publish"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"
          # setup-beam never retries a mirror; jsDelivr proxies builds.hex.pm.
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Parse package and version
        id: parse
        env:
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_PACKAGE" ]; then
            PACKAGE="$INPUT_PACKAGE"
            VERSION="$INPUT_VERSION"
          else
            # Tags are `<package>-v<version>`. Package names are snake_case
            # with no hyphens, so the first `-v` is the separator; taking the
            # version from the last one keeps hyphenated prereleases intact
            # (lemon_platform_test-v1.2.3-rc.1).
            PACKAGE="${REF_NAME%-v*}"
            VERSION="${REF_NAME##*-v}"
          fi

          if [ -z "$PACKAGE" ] || [ -z "$VERSION" ]; then
            echo "::error::could not determine package/version from '$REF_NAME'"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE  Version: $VERSION"

      - name: Verify the tagged release
        run: |
          scripts/release_package \
            "${{ steps.parse.outputs.package }}" \
            "${{ steps.parse.outputs.version }}" \
            --verify

  publish:
    name: Publish to hex.pm
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.inputs.verify_only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.19.5"
          # setup-beam never retries a mirror; jsDelivr proxies builds.hex.pm.
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Publish package and docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::notice::HEX_API_KEY is not configured — skipping publish of $PACKAGE $VERSION."
            exit 0
          fi

          scripts/release_package "$PACKAGE" "$VERSION" --publish-tagged
