# Provider credentials — prefer secret refs (api_key_secret) over plaintext api_key.
# Run `mix lemon.secrets.set <secret_name> <value>` to store keys in the encrypted keychain.
# Plaintext api_key is supported but discouraged; use it only for quick local testing.
#
# Control-plane operator authentication is environment-only so the shared secret
# is not written to this file. Set LEMON_CONTROL_PLANE_OPERATOR_TOKEN for normal
# WebSocket operator access. Legacy tokenless loopback access is disabled unless
# LEMON_CONTROL_PLANE_ALLOW_UNAUTHENTICATED_LOOPBACK=true is explicitly set.
# The source ./bin/lemon-tui launcher generates a process-scoped token for a
# runtime it starts; attaching to an existing runtime requires its matching env
# value. Every runtime it starts is stopped with the TUI, even with a
# preconfigured token; start persistent runtimes separately with ./bin/lemon
# --daemon. Never put the shared token in a browser VITE_* variable or URL.
# Named node pairing sends the operator token from LEMON_NODE_OPERATOR_TOKEN on
# the joining host. Named workers require wss:// for non-loopback controllers by
# default. LEMON_NODE_ALLOW_INSECURE_CONTROLLER=true is an explicit development
# or verified-encrypted-overlay override and is not safe on an unverified path.
# Backups have no TOML settings. Use `lemon backup create`; local credential
# files remain excluded unless `--include-credentials` is explicit.

[providers.anthropic]
api_key_secret = "anthropic_api_key"
# api_key = "<anthropic-api-key>"  # plaintext fallback — discouraged

[providers.openai]
api_key_secret = "openai_api_key"
# api_key = "<openai-api-key>"  # plaintext fallback — discouraged
# base_url = "http://127.0.0.1:11434/v1"  # optional OpenAI-compatible endpoint

[providers.opencode]
api_key_secret = "opencode_api_key"
# api_key = "<opencode-api-key>"  # plaintext fallback — discouraged
base_url = "https://opencode.ai/zen/v1"

[providers.kimi]
api_key_secret = "kimi_api_key"
# api_key = "<kimi-api-key>"  # plaintext fallback — discouraged
base_url = "https://api.kimi.com/coding/"

[providers.zai]
api_key_secret = "llm_zai_api_key"
# api_key = "..."  # plaintext fallback — discouraged
base_url = "https://api.z.ai/api/coding/paas/v4"

[providers.google]
api_key_secret = "google_api_key"
# api_key = "..."  # plaintext fallback — discouraged

[defaults]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
thinking_level = "medium"

[runtime]
theme = "default"
extension_paths = []

[runtime.compaction]
enabled = true
reserve_tokens = 16384
keep_recent_tokens = 20000

[runtime.retry]
enabled = true
max_retries = 3
base_delay_ms = 1000

# `lemon context preview|resolve` budgets are explicit per invocation rather
# than persisted here. This prevents shared config from silently raising a
# caller's file/URL/archive/page/item/time limits. See
# docs/user-guide/context-references.md for the bounded flags and defaults.

# Programmatic tool calling: the model submits a python3 script that can call a fixed
# allowlist of agent tools (read, grep, find, ls, webfetch); only what the script prints
# comes back. The script runs as HOST CODE with bash-equivalent permissions — this is not
# a sandbox. Default-off; requires python3 (or python_path) plus, on GNU/Linux, GNU
# mktemp and a local-filesystem TMPDIR for the private workspace.
# See docs/tools/execute-code.md before enabling.
#
# [runtime.tools.execute_code]
# enabled = false
# python_path = ""              # empty = find python3 on PATH
# timeout_ms = 120000           # wall-time cap per run
# max_rpc_calls = 100           # helper calls per run
# max_rpc_result_bytes = 5242880
# max_output_bytes = 50000
# tools = []                    # helper subset; empty = full fixed allowlist
#
# kernel_mode = "per_call"      # "per_call" (default): every run is a fresh process.
#                               # "session": opt-in persistent interpreter per
#                               # session/cwd/interpreter/helper identity. State is live
#                               # process memory only — never durable — and is lost on
#                               # session close/reset, idle reap, eviction, or restart.
# kernel_idle_timeout_ms = 1800000   # idle kernels reaped after 30 minutes
# max_live_kernels = 16              # strict cap; idle-only LRU eviction
# max_queued_cells_per_kernel = 8    # serialized cells; full queue = busy error
#
# Env overrides: LEMON_EXECUTE_CODE_ENABLED, LEMON_EXECUTE_CODE_PYTHON_PATH,
# LEMON_EXECUTE_CODE_TIMEOUT_MS, LEMON_EXECUTE_CODE_MAX_RPC_CALLS,
# LEMON_EXECUTE_CODE_MAX_RPC_RESULT_BYTES, LEMON_EXECUTE_CODE_MAX_OUTPUT_BYTES,
# LEMON_EXECUTE_CODE_TOOLS, LEMON_EXECUTE_CODE_KERNEL_MODE,
# LEMON_EXECUTE_CODE_KERNEL_IDLE_TIMEOUT_MS, LEMON_EXECUTE_CODE_MAX_LIVE_KERNELS,
# LEMON_EXECUTE_CODE_MAX_QUEUED_CELLS_PER_KERNEL

[tui]
theme = "lemon"
debug = false

[gateway]
max_concurrent_runs = 2
# Optional fallback working directory for unbound chats/sessions.
# If omitted, Lemon defaults to your home directory.
default_cwd = "~/"
auto_resume = false
enable_telegram = false
enable_discord = false
enable_webhook = false
enable_xmtp = false
require_engine_lock = true
engine_lock_timeout_ms = 60000

[gateway.queue]
mode = "collect"
cap = 50
drop = "oldest"

[gateway.telegram]
bot_token = "123456:token"
allowed_chat_ids = [12345678]
# default_account_id = "default"
# default_chat_id = 12345678
# default_thread_id = 35
poll_interval_ms = 1000
edit_throttle_ms = 1000
debounce_ms = 1000
allow_queue_override = false
account_id = "default"
offset = 0
drop_pending_updates = false

[gateway.xmtp]
# XMTP network: production | dev | local
env = "production"
# Optional custom API URL (leave unset for SDK defaults)
# api_url = "https://api.xmtp.network"
# Bot wallet credentials (prefer secret refs; env fallback still works)
wallet_address = "${XMTP_WALLET_ADDRESS}"
wallet_key_secret = "XMTP_WALLET_KEY"
# Optional explicit inbox id (typically discovered by SDK)
# inbox_id = ""
# Local SDK storage path
db_path = "~/.lemon/xmtp-db"
# Poll cadence for inbound messages
poll_interval_ms = 1500
# Fail readiness if live mode is unavailable
require_live = true
# Max time to wait for bridge connect before marking unavailable
connect_timeout_ms = 15000
# Set true only for local development without live XMTP
mock_mode = false

[gateway.projects.example]
root = "/path/to/project"

[[gateway.bindings]]
transport = "telegram"
chat_id = 12345678
topic_id = 0
project = "example"
queue_mode = "collect"

