# --- Feature Flags ---
# Each flag is an operator kill switch for a subsystem; all ship enabled.
# Valid states: "off" | "opt-in" | "default-on"
#   off          - feature is fully disabled (kill-switch)
#   opt-in       - legacy pre-promotion state; behaves like "off" unless the caller opts in
#   default-on   - enabled unless explicitly disabled (the shipped default)
# Environment variable override: LEMON_FEATURE_<FLAG_NAME> (SCREAMING_SNAKE_CASE)

# [features]
# session_search         = "default-on" # memory ingest + SessionSearch API + search_memory tool
# routing_feedback       = "default-on" # task fingerprinting + routing feedback recording
# skill_synthesis_drafts = "default-on" # scheduled skill-synthesis draft pipeline
