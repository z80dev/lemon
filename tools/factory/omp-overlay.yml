# Factory coordinator overlay, passed with `omp --config`. Pins only the
# behavior the factory depends on and the seam tests verify. Model roles and
# task.agentModelOverrides stay with the user's own profile.
async:
  enabled: true # native task workers run as background jobs
task:
  structured: true # expose outputSchema/schemaMode and the worker yield tool
  isolation:
    enabled: true
    apply: false # never apply worker changes to the coordinator checkout
    merge: branch # retain each worker's result on omp/task/<id>
