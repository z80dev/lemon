<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none"><title>Lemon — Your agents. Your machine. Your move.</title><desc>Open-source, local-first AI assistant platform. Lemon yellow and ink branding on a cream background.</desc><rect width="1200" height="460" rx="20" fill="#FAF9F3"/><defs><pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#C7CCB9"/></pattern></defs><rect x="750" y="30" width="420" height="400" fill="url(#dots)"/><rect x="56" y="45" width="42" height="42" rx="12" fill="#DEEF62"/><path d="M65 73C64 65 70 55 79 55L85 55L89 53L88 58C92 63 89 71 84 76C78 80 72 79 69 77L65 78Z" fill="#20261F"/><text x="110" y="77" fill="#20261F" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" letter-spacing="-2">lemon</text><text x="56" y="160" fill="#59604E" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">OPEN SOURCE. LOCAL FIRST. BUILT ON THE BEAM.</text><text x="53" y="233" fill="#20261F" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="700" letter-spacing="-3">Your agents. Your machine.</text><text x="53" y="307" fill="#20261F" font-family="Georgia,serif" font-size="69" font-style="italic" letter-spacing="-3">Your move.</text><text x="56" y="379" fill="#59604E" font-family="Arial,Helvetica,sans-serif" font-size="18">Models, tools, memory, and conversations. One runtime you control.</text><g transform="translate(920 160) rotate(-14)"><rect x="-25" y="-25" width="190" height="190" rx="48" fill="#DEEF62"/><path d="M9 101C4 68 32 28 70 28C79 28 86 30 93 31L109 21L107 42C121 64 109 97 88 113C64 132 38 127 24 118L8 122Z" fill="#20261F"/><path d="M40 84C42 68 54 56 70 51" stroke="#DEEF62" stroke-width="7" stroke-linecap="round"/><path d="M79 18C76 2 95-3 109 2C107 16 97 25 79 18Z" fill="#20261F"/></g></svg>
